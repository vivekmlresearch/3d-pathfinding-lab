<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
<title id="t">Mean nodes expanded against cube volume, log-log</title>
<desc id="d">Expansions grow roughly linearly with volume for the exact algorithms; greedy best-first grows far slower.</desc>
